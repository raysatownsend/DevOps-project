<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo CI/CD da Bookstore</title>
  <desc id="desc">Flow from GitHub Actions CI to Terraform infrastructure, Ansible configuration, Docker Compose deployment on AWS EC2, and HTTP verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ed"/>
      <stop offset="1" stop-color="#e7eef2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#356b80"/>
    </marker>
    <style>
      .title { font: 700 34px Georgia, serif; fill: #16324f; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, sans-serif; fill: #52636b; }
      .heading { font: 700 19px -apple-system, BlinkMacSystemFont, sans-serif; fill: #16324f; }
      .body { font: 400 15px -apple-system, BlinkMacSystemFont, sans-serif; fill: #40545d; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif; fill: #356b80; letter-spacing: 1px; }
      .box { stroke: #c4d2d7; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .arrow { stroke: #356b80; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1450" cy="90" r="180" fill="#d9e7e4" opacity="0.55"/>
  <circle cx="110" cy="880" r="220" fill="#eadfcf" opacity="0.55"/>

  <text x="80" y="78" class="title">Bookstore CI/CD</text>
  <text x="80" y="112" class="subtitle">Da alteracao do codigo a aplicacao Docker na AWS EC2</text>

  <rect x="80" y="160" width="280" height="150" class="box" fill="#fffdf8"/>
  <text x="110" y="202" class="small">CODIGO-FONTE</text>
  <text x="110" y="238" class="heading">GitHub</text>
  <text x="110" y="267" class="body">Push ou Pull Request</text>
  <text x="110" y="291" class="body">Codigo da aplicacao e infraestrutura</text>

  <rect x="430" y="160" width="300" height="150" class="box" fill="#dcecf0"/>
  <text x="460" y="202" class="small">INTEGRACAO CONTINUA</text>
  <text x="460" y="238" class="heading">CI - Testes automatizados</text>
  <text x="460" y="267" class="body">Testes, build do frontend e Docker</text>

  <path d="M360 235 H430" class="arrow"/>

  <rect x="800" y="145" width="330" height="180" class="box" fill="#f4e8d6"/>
  <text x="830" y="187" class="small">INFRAESTRUTURA COMO CODIGO</text>
  <text x="830" y="223" class="heading">Infraestrutura Terraform</text>
  <text x="830" y="252" class="body">Plan nas alteracoes de codigo</text>
  <text x="830" y="276" class="body">Apply manual com aprovacao</text>
  <text x="830" y="300" class="body">VPC, subnet, security group e EC2</text>

  <path d="M730 220 H800" class="arrow dashed"/>
  <text x="744" y="205" class="small">PLAN</text>

  <rect x="1200" y="145" width="300" height="180" class="box" fill="#e4eee6"/>
  <text x="1230" y="187" class="small">AWS</text>
  <text x="1230" y="223" class="heading">EC2 provisionada</text>
  <text x="1230" y="252" class="body">IP publico e acesso SSH</text>
  <text x="1230" y="276" class="body">Pronta para configuracao do Docker</text>

  <path d="M1130 235 H1200" class="arrow"/>
  <text x="1146" y="220" class="small">APPLY</text>

  <rect x="430" y="430" width="300" height="170" class="box" fill="#e8e2f0"/>
  <text x="460" y="472" class="small">ENTREGA CONTINUA</text>
  <text x="460" y="508" class="heading">CD - Deploy na AWS</text>
  <text x="460" y="537" class="body">Acionado apos o CI com sucesso</text>
  <text x="460" y="561" class="body">Conecta-se a EC2 por SSH</text>
  <text x="460" y="585" class="body">Executa o playbook Ansible</text>

  <path d="M580 310 V430" class="arrow"/>
  <text x="596" y="380" class="small">SUCESSO</text>

  <rect x="800" y="430" width="330" height="170" class="box" fill="#dcecf0"/>
  <text x="830" y="472" class="small">CONFIGURACAO</text>
  <text x="830" y="508" class="heading">Ansible</text>
  <text x="830" y="537" class="body">Instala Docker e Compose</text>
  <text x="830" y="561" class="body">Copia arquivos para /opt/bookstore</text>
  <text x="830" y="585" class="body">Inicia o Docker Compose</text>

  <path d="M730 515 H800" class="arrow"/>

  <rect x="1200" y="400" width="300" height="230" class="box" fill="#e4eee6"/>
  <text x="1230" y="442" class="small">EXECUCAO DOS CONTAINERS</text>
  <text x="1230" y="478" class="heading">Docker na EC2</text>
  <text x="1230" y="515" class="body">docker compose up -d --build</text>
  <text x="1230" y="552" class="body">Container frontend</text>
  <text x="1230" y="578" class="body">Container backend</text>
  <text x="1230" y="604" class="body">Rede compartilhada da aplicacao</text>

  <path d="M1130 515 H1200" class="arrow"/>

  <rect x="800" y="730" width="330" height="150" class="box" fill="#fffdf8"/>
  <text x="830" y="772" class="small">ROTEAMENTO HTTP</text>
  <text x="830" y="808" class="heading">Nginx</text>
  <text x="830" y="837" class="body">Serve o React na porta 80</text>
  <text x="830" y="861" class="body">Encaminha /api para backend:8081</text>

  <path d="M1350 630 V680 H965 V730" class="arrow"/>

  <rect x="1200" y="730" width="300" height="150" class="box" fill="#f4e8d6"/>
  <text x="1230" y="772" class="small">VERIFICACAO</text>
  <text x="1230" y="808" class="heading">Teste de funcionamento</text>
  <text x="1230" y="837" class="body">curl http://EC2_HOST/</text>
  <text x="1230" y="861" class="body">Deploy aprovado ou falha identificada</text>

  <path d="M1130 805 H1200" class="arrow"/>
</svg>
