services:
  backend:
    build: ./backend
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081', response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy