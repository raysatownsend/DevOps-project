name: CD - Continuous Delivery and Deploy to Github

on: 
    workflow_run:
        workflows: ["CI - Automated Tests"]
        types: 
            - completed
    push: 
        branches: ["bookstore-1.0-feature"]

jobs:
    deploy:
        if: >
          github.event_name == 'push' ||
          github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest

        steps: 
            - name: Checkout do Código
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '24'
                cache: npm
                cache-dependency-path: |
                  frontend/package-lock.json
                  backend/package-lock.json

            - name: Instalar dependências do frontend
              working-directory: frontend
              run: npm ci

            - name: Executar testes
              working-directory: frontend
              run: npm test --watchAll=false

            - name: Gerar build do frontend
              working-directory: frontend
              run: npm run build
              env:
                CI: false

            - name: Instalar dependências do backend
              working-directory: backend
              run: npm ci

            - name: Gerar build do backend
              working-directory: backend
              run: npm run build
              env:
                CI: false

            - name: Build Application Artifacts
              run: npm run build

            - name: Deploy to Server using SSH
              uses: appleboy/ssh-action@v0.1.0
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{secrets.SSH_PRIVATE_KEY}}
                port: 22
                script: | 
                    cd /Users/raysatownsend/Documents/PUCRS-Graduacao/Desenvolvimento-de-Sistemas-Front-End/projeto/bookstore
                    git pull origin main
                    cd frontend
                    npm install
                    cd ../
                    cd backend
                    npm install
                    pm2 restart app   